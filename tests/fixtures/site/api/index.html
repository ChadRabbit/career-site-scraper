<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Globex Careers</title>
  <style>
    .card { border: 1px solid #ccc; padding: 16px; margin: 8px; height: 50px; }
    .card h3 { margin: 0; }
  </style>
</head>
<body>
<h1>Open roles</h1>
<div id="list"></div>
<button id="more" type="button">Load more</button>
<script>
  let page = 0;
  async function load() {
    page += 1;
    const res = await fetch(`/api/jobs?page=${page}`);
    const data = await res.json();
    for (const job of data.data.results) {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `<h3><a href="${job.url}">${job.title}</a></h3><span>${job.location.city}, ${job.location.countryName}</span>`;
      document.getElementById("list").appendChild(div);
    }
    if (page * 10 >= data.data.total) document.getElementById("more").remove();
  }
  fetch("/api/config.json").then((r) => r.json());  // decoy JSON that is not a job list
  load();
  document.getElementById("more").addEventListener("click", load);
</script>
</body>
</html>
