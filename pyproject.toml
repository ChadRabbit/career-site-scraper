[project]
name = "career-site-scraper"
version = "2.0.0"
description = "Onboard any career site by clicking through it once, then scrape it politely on a schedule."
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, pyupgrade, simplify, import sorting
select = ["F", "E", "W", "B", "UP", "SIM", "I"]
ignore = [
    "SIM105",  # try/except/pass is clearer than contextlib.suppress in a few async spots
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
